name: toast_overlay
description: >-
  An animated, themeable overlay toast for Flutter with an auto-dismiss
  countdown ring and an optional copyable support reference id.
version: 0.1.0
repository: https://github.com/m-zarif/toast_overlay
issue_tracker: https://github.com/m-zarif/toast_overlay/issues

topics:
  - toast
  - notification
  - snackbar
  - overlay

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  figma_squircle: ^0.6.3
  remixicon: ^4.9.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
