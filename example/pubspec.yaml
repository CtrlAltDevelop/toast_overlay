name: toast_overlay_example
description: Demonstrates toast_overlay.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  toast_overlay:
    path: ../
  # The package itself defaults to Material Icons and has no icon dependency;
  # the example overrides ToastTheme.icons to show Remix Icons instead.
  remixicon: ">=4.9.3 <5.0.0"
  material_ui: ">=1.0.0 <2.0.0"

dev_dependencies:
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

