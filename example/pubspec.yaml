name: toast_overlay_example
description: Demonstrates toast_overlay.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  toast_overlay:
    path: ../
  # Only needed because the example spells out the icon set; the package
  # already ships these as its defaults.
  remixicon: ^4.9.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
