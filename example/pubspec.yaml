name: toast_overlay_example
description: Demonstrates toast_overlay.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  toast_overlay:
    path: ../
  # The package itself defaults to Material Icons and has no icon dependency;
  # the example overrides ToastTheme.icons to show Remix Icons instead.
  remixicon: ^4.9.3
  material_ui: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

